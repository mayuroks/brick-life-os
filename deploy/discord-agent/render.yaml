# Render blueprint: Life OS agent exposed as a Discord surface.
# Deploys via Docker (see Dockerfile) on the free tier, driven from GitHub.
services:
  - type: web
    name: discord-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Set these as secret values in the Render dashboard (never committed).
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: JIRA_URL
        sync: false
      - key: JIRA_USERNAME
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Voice transcription: default to the baked tiny model (free-tier safe).
      - key: WHISPER_MODEL
        value: /app/models/ggml-tiny.en.bin
