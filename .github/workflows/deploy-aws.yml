name: Deploy discord-agent to AWS (ECS Fargate)

# Builds the deploy/discord-agent Docker image and ships it to Amazon ECR,
# then deploys it to the discord-agent ECS Fargate service. Text-only
# (no whisper/ffmpeg) so the image stays thin and builds fast.
#
# Docker layer caching (GitHub Actions cache) is enabled so repeat deploys
# reuse cached apt/npm/opencode layers instead of re-downloading (~1min).

on:
  push:
    branches: [main]
    paths:
      - 'deploy/discord-agent/**'
      - '.github/workflows/deploy-aws.yml'
  workflow_dispatch:

# Auth via a dedicated IAM user's access keys stored as GitHub repo secrets
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY). Keys are scoped to the
# github-actions-deploy user (ECR+ECS only).
permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: discord-agent
  ECS_CLUSTER: discord-agent
  ECS_SERVICE: discord-agent
  ECS_TASK_DEFINITION: discord-agent
  IMAGE_TAG: ${{ github.sha }}
  APP_DIR: deploy/discord-agent
  # Networking for the Fargate service (non-secret; provisioned, see plan.md).
  VPC_SUBNETS: subnet-095fcc9c91573090a,subnet-020e0b3e4c1194a2b
  VPC_SG: sg-07b02730b243cefee

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.imageid }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push image to ECR (SHA + latest, with cache)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          file: ${{ env.APP_DIR }}/Dockerfile
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Deploy to ECS Fargate
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
        run: |
          # Register the task definition from the committed template so the SSM
          # task role (needed for ECS Exec / SSH) survives every deploy instead
          # of drifting when only the bare service name is used. The template
          # references :latest, so the registered revision picks up the freshly
          # pushed image on the next deployment.
          aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json "file://$APP_DIR/task-def.json"
          # Create the service on first deploy if absent; otherwise update it.
          if ! aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Service not found — creating (one-time infrastructure)."
            aws ecs create-service \
              --cluster "$ECS_CLUSTER" \
              --service-name "$ECS_SERVICE" \
              --task-definition "$ECS_TASK_DEFINITION" \
              --desired-count 1 \
              --launch-type FARGATE \
              --enable-execute-command \
              --network-configuration \
                "{\"awsvpcConfiguration\":{\"subnets\":[\"$VPC_SUBNETS\"],\"securityGroups\":[\"$VPC_SG\"],\"assignPublicIp\":\"ENABLED\"}}" \
              --region "$AWS_REGION"
          fi
          # Any step failure aborts the run (set -e in run step); a failed
          # rollout keeps the previous healthy task serving (FR-007).
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$ECS_TASK_DEFINITION" \
            --enable-execute-command \
            --force-new-deployment \
            --region "$AWS_REGION"
          echo "Deployment triggered for $IMAGE_URI (cluster=$ECS_CLUSTER service=$ECS_SERVICE)."
